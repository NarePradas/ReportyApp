<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orden de Trabajo · ReportyApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: #000000;
      background-image:
        radial-gradient(ellipse at top left,  rgba(27, 80, 10, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(12, 68, 124, 0.5) 0%, transparent 55%),
        radial-gradient(ellipse at center, rgba(5, 18, 5, 0.9) 0%, #000000 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e8f5e2;
    }

    /* ── Navbar ── */
    .rapp-navbar {
      background: rgba(10, 20, 10, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(100, 200, 80, 0.12);
      padding: 12px 24px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .rapp-logo-circle {
      width: 36px; height: 36px; border-radius: 9px;
      background: #3B6D11;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .rapp-logo-circle i { color: #C0DD97; font-size: 18px; }
    .rapp-brand { font-size: 15px; font-weight: 500; color: #e8f5e2; }
    .rapp-brand span { color: #7aab5a; font-weight: 400; }
    
    .btn-back {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px;
      border: 1px solid rgba(100,200,80,0.25);
      background: rgba(99,153,34,0.1);
      color: #97C459; font-size: 13px; font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-back:hover {
      background: rgba(99,153,34,0.22);
      border-color: rgba(100,200,80,0.45);
      color: #C0DD97;
    }

    /* ── Page header ── */
    .page-header {
      padding: 32px 0 20px;
      border-bottom: 1px solid rgba(100,200,80,0.1);
      margin-bottom: 24px;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(55,138,221,0.12);
      border: 1px solid rgba(55,138,221,0.25);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 11px; color: #85B7EB;
      letter-spacing: 0.05em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .page-header h1 { font-size: 22px; font-weight: 500; color: #e8f5e2; margin: 0 0 6px; }
    .page-header p  { font-size: 14px; color: #7aab5a; margin: 0; }

    /* ── Form sections ── */
    .form-section {
      background: rgba(10, 22, 10, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(100,200,80,0.13);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 16px;
    }
    .form-section > h2 {
      font-size: 13px; font-weight: 500;
      color: #97C459;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 0 0 24px;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Labels & inputs ── */
    label {
      display: block;
      font-size: 12px; font-weight: 500;
      color: #7aab5a;
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 7px;
    }
    input[type="text"],
    input[type="date"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(100,200,80,0.18);
      border-radius: 8px;
      padding: 11px 14px;
      color: #e8f5e2;
      font-size: 14px; font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(99,153,34,0.55);
      box-shadow: 0 0 0 3px rgba(99,153,34,0.12);
    }
    input::placeholder, textarea::placeholder { color: rgba(122,171,90,0.4); }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7) sepia(1) hue-rotate(60deg); cursor: pointer;
    }
    select option { background: #0d1f0d; color: #e8f5e2; }
    textarea { resize: vertical; min-height: 100px; }
    .form-group { margin-bottom: 0; }

    /* ── Operación card ── */
    .operacion-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(55,138,221,0.15);
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 14px;
      position: relative;
    }
    .operacion-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 10px 10px 0 0;
      background: linear-gradient(90deg, #185FA5, #378ADD);
    }
    .operacion-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .operacion-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(55,138,221,0.12);
      border: 1px solid rgba(55,138,221,0.25);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px; font-weight: 500;
      color: #85B7EB;
    }
    .operacion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .operacion-grid .form-group { margin-bottom: 0; }
    .operacion-grid .form-group.span2 { grid-column: span 2; }

    /* Cantidad total destacada */
    input.cantidad-total-input {
      background: rgba(99,153,34,0.1) !important;
      color: #C0DD97 !important;
      border-color: rgba(99,153,34,0.25) !important;
      font-weight: 600;
      cursor: default;
    }

    /* Divisor entre grupos de campos */
    .field-divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1px solid rgba(100,200,80,0.08);
      margin: 4px 0;
    }

    /* ── Buttons ── */
    .btn-add-op {
      display: inline-flex; align-items: center; gap: 8px;
      width: 100%; justify-content: center;
      padding: 11px 20px;
      border-radius: 8px;
      border: 1px dashed rgba(55,138,221,0.35);
      background: rgba(55,138,221,0.07);
      color: #85B7EB; font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      margin-top: 4px;
    }
    .btn-add-op:hover {
      background: rgba(55,138,221,0.16);
      border-color: rgba(55,138,221,0.5);
      color: #B5D4F4;
    }

    .btn-delete-row {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(180,40,40,0.1);
      border: 1px solid rgba(180,40,40,0.25);
      border-radius: 7px;
      color: #e07070; font-size: 12px; font-weight: 500;
      padding: 5px 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-delete-row:hover { background: rgba(180,40,40,0.22); }

    .form-actions {
      padding: 20px 0 40px;
      display: flex; justify-content: flex-end;
    }
    .btn-generate {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 30px;
      border-radius: 10px; border: none;
      background: linear-gradient(135deg, #185FA5, #0c447c);
      color: #e8f5e2; font-size: 15px; font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(55,138,221,0.3);
    }
    .btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-generate:active { transform: translateY(0); }

    /* ── hidden table for PDF scraping ── */
    #operacionesTable { display: none; }
  </style>
</head>
<body>

  <nav class="rapp-navbar">
    <div class="rapp-logo-circle"><i class="ti ti-plant"></i></div>
    <div class="rapp-brand">ReportyApp <span>· Campo</span></div>
    <a href="index.html" class="btn-back">
      <i class="ti ti-arrow-left" style="font-size:14px;"></i> Volver
    </a>
  </nav>

  <div class="container" style="max-width: 900px; padding-bottom: 40px;">

    <div class="page-header">
      <div class="eyebrow">
        <i class="ti ti-tractor" style="font-size:12px;"></i>
        Laboreos
      </div>
      <h1>Órdenes de Trabajo Agronómicas</h1>
      <p>Gestión de laboreos por lote · Registro de operaciones</p>
    </div>

    <form id="ordenForm">

      <!-- Información General -->
      <section class="form-section">
        <h2><i class="ti ti-info-circle"></i> Información general</h2>
        <div class="row g-3">
          <div class="col-md-4">
            <div class="form-group">
              <label for="numeroOrden">Número de orden</label>
              <input type="text" id="numeroOrden" placeholder="Ej: OT-2025-001" required>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="establecimiento">Establecimiento</label>
              <input type="text" id="establecimiento" placeholder="Nombre del establecimiento" required>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="contratista">Contratista</label>
              <input type="text" id="contratista" placeholder="Nombre del contratista" required>
            </div>
          </div>
        </div>
      </section>

      <!-- Operaciones -->
      <section class="form-section">
        <h2><i class="ti ti-clipboard-list"></i> Operaciones</h2>

        <div id="operacionesContainer"></div>

        <button type="button" class="btn-add-op" onclick="agregarOperacion()">
          <i class="ti ti-plus" style="font-size:14px;"></i> Agregar operación
        </button>
      </section>

      <!-- Información Adicional -->
      <section class="form-section">
        <h2><i class="ti ti-notes"></i> Información adicional</h2>
        <div class="form-group">
          <label for="infoAdicional">Observaciones y notas</label>
          <textarea id="infoAdicional" rows="4" placeholder="Ingrese información adicional sobre la orden de trabajo..."></textarea>
        </div>
      </section>

      <!-- Tabla oculta para compatibilidad con generarPDF -->
      <table id="operacionesTable">
        <tbody id="operacionesBody"></tbody>
      </table>

      <div class="form-actions">
        <button type="button" class="btn-generate" onclick="generarPDF()">
          <i class="ti ti-file-type-pdf" style="font-size:18px;"></i>
          Generar PDF
        </button>
      </div>

    </form>
  </div>
 <footer class="text-light py-4 mt-auto">
  <div class="container text-center">
    <p class="mb-0">
      © 2026 Sitio Web Desarrollado por Upya Digital.
    </p>
  </div>
</footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <script>
    let opCounter = 0

    document.addEventListener("DOMContentLoaded", () => {
      agregarOperacion()
    })

    function agregarOperacion() {
      const container = document.getElementById("operacionesContainer")
      const opIndex = opCounter++

      const card = document.createElement("div")
      card.className = "operacion-card"
      card.setAttribute("data-op-index", opIndex)

      card.innerHTML = `
        <div class="operacion-header">
          <span class="operacion-badge">
            <i class="ti ti-clipboard" style="font-size:12px;"></i>
            Operación ${opIndex + 1}
          </span>
          <button type="button" class="btn-delete-row" onclick="eliminarOperacion(this)">
            <i class="ti ti-trash" style="font-size:13px;"></i> Eliminar
          </button>
        </div>

        <div class="operacion-grid">
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" class="fecha-input" required>
          </div>
          <div class="form-group">
            <label>Cultivo</label>
            <input type="text" class="cultivo-input" placeholder="Ej: Soja">
          </div>
          <div class="form-group">
            <label>Lote</label>
            <input type="text" class="lote-input" placeholder="Ej: Lote Norte">
          </div>
          <div class="form-group">
            <label>Superficie (ha)</label>
            <input type="number" class="superficie-input" step="0.01" placeholder="0.00" oninput="calcularCantidadTotal(this)">
          </div>

          <hr class="field-divider">

          <div class="form-group">
            <label>Labor / Producto</label>
            <input type="text" class="labor-input" placeholder="Ej: Herbicida / Glifosato">
          </div>
          <div class="form-group">
            <label>Unidad</label>
            <select class="unidad-input">
              <option value="L">L</option>
              <option value="Kg">Kg</option>
              <option value="gr">gr</option>
              <option value="Ml">Ml</option>
              <option value="Pl">Pl</option>
            </select>
          </div>
          <div class="form-group">
            <label>Dosis técnica</label>
            <input type="number" class="dosis-tecnico-input" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Dosis real</label>
            <input type="number" class="dosis-real-input" step="0.01" placeholder="0.00" oninput="calcularCantidadTotal(this)">
          </div>
          <div class="form-group">
            <label>Cantidad total</label>
            <input type="number" class="cantidad-total-input" step="0.01" placeholder="—" readonly>
          </div>

          <hr class="field-divider">

          <div class="form-group span2">
            <label>Operario / Maquinaria</label>
            <input type="text" class="operario-input" placeholder="Nombre del operario o equipo">
          </div>
        </div>
      `

      container.appendChild(card)
    }

    function calcularCantidadTotal(input) {
      const card = input.closest(".operacion-card")
      const superficie = parseFloat(card.querySelector(".superficie-input").value) || 0
      const dosisReal = parseFloat(card.querySelector(".dosis-real-input").value) || 0
      card.querySelector(".cantidad-total-input").value = (superficie * dosisReal).toFixed(2)
    }

    function eliminarOperacion(btn) {
      btn.closest(".operacion-card").remove()
    }

    function formatearFecha(fechaISO) {
      if (!fechaISO) return ""
      const [year, month, day] = fechaISO.split("-")
      return `${day}/${month}/${year}`
    }

    function generarPDF() {
      const { jsPDF } = window.jspdf
      const doc = new jsPDF("l", "mm", "a4")

      const pageWidth = doc.internal.pageSize.getWidth()
      const margin = 10
      let yPos = margin

      doc.setTextColor(0, 0, 0)
      doc.setFontSize(14)
      doc.setFont(undefined, "bold")
      doc.text("ORDEN DE TRABAJO", margin, yPos)
      yPos += 8

      doc.setFontSize(10)
      doc.setFont(undefined, "normal")
      const numeroOrden = document.getElementById("numeroOrden").value
      const establecimiento = document.getElementById("establecimiento").value
      const contratista = document.getElementById("contratista").value

      doc.text(`Orden: ${numeroOrden}`, margin, yPos)
      doc.text(`Establecimiento: ${establecimiento}`, margin + 80, yPos)
      doc.text(`Contratista: ${contratista}`, margin + 180, yPos)
      yPos += 10

      // Recopilar desde las cards
      const operaciones = []
      const cards = document.querySelectorAll(".operacion-card")

      cards.forEach((card) => {
        const fecha = card.querySelector(".fecha-input").value
        const cultivo = card.querySelector(".cultivo-input").value
        const lote = card.querySelector(".lote-input").value
        const superficie = card.querySelector(".superficie-input").value
        const labor = card.querySelector(".labor-input").value
        const unidad = card.querySelector(".unidad-input").value
        const dosisTecnico = card.querySelector(".dosis-tecnico-input").value
        const dosisReal = card.querySelector(".dosis-real-input").value
        const cantidadTotal = card.querySelector(".cantidad-total-input").value
        const operario = card.querySelector(".operario-input").value

        operaciones.push([
          formatearFecha(fecha),
          cultivo,
          lote,
          superficie,
          labor,
          unidad,
          dosisTecnico,
          dosisReal,
          cantidadTotal,
          operario,
        ])
      })

      doc.autoTable({
        startY: yPos,
        head: [[
          "Fecha", "Cultivo", "Lote", "Superficie (ha)",
          "Labor/Producto", "Unidad", "Dosis Técnica",
          "Dosis Real", "Cantidad Total", "Operario/Maquinaria",
        ]],
        body: operaciones,
        theme: "grid",
        headStyles: {
          fillColor: [255, 255, 255],
          textColor: [0, 0, 0],
          fontSize: 9, fontStyle: "bold",
          lineWidth: 0.5, lineColor: [0, 0, 0],
        },
        bodyStyles: {
          fontSize: 9,
          lineWidth: 0.5, lineColor: [0, 0, 0],
        },
        margin: { left: margin, right: margin },
        styles: { cellPadding: 3, overflow: "linebreak" },
      })

      yPos = doc.lastAutoTable.finalY + 10

      if (yPos > 170) { doc.addPage(); yPos = margin }

      doc.setFontSize(10)
      doc.setFont(undefined, "bold")
      yPos += 6

      const infoAdicional = document.getElementById("infoAdicional").value
      if (infoAdicional) {
        if (yPos > 170) { doc.addPage(); yPos = margin }

        doc.setFont(undefined, "bold")
        doc.text("Observaciones:", margin, yPos)
        yPos += 6
        

        doc.setFont(undefined, "normal")
        const texto = infoAdicional
        const splitText = doc.splitTextToSize(texto, pageWidth - 2 * margin)
        const lineHeight = 6
        const blockHeight = splitText.length * lineHeight

        doc.setFillColor(255, 255, 0)
        doc.rect(margin - 2, yPos - 4, pageWidth - 2 * margin + 4, blockHeight + 6, "F")

        doc.setTextColor(0, 0, 0)
        doc.text(splitText, margin, yPos)
        yPos += blockHeight + 4
       
      }
       
      doc.save(`Orden_Trabajo_${numeroOrden}.pdf`)
    }
  </script>

</body>
</html>
