
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe de Monitoreo · ReportyApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
   <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: #000000;
      background-image:
        radial-gradient(ellipse at top left,  rgba(27, 80, 10, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(12, 68, 124, 0.5) 0%, transparent 55%),
        radial-gradient(ellipse at center, rgba(5, 18, 5, 0.9) 0%, #000000 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e8f5e2;
    }

    /* ── Navbar ── */
    .rapp-navbar {
      background: rgba(10, 20, 10, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(100, 200, 80, 0.12);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .rapp-logo-circle {
      width: 36px; height: 36px; border-radius: 9px;
      background: #3B6D11;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .rapp-logo-circle i { color: #C0DD97; font-size: 18px; }
    .rapp-brand { font-size: 15px; font-weight: 500; color: #e8f5e2; }
    .rapp-brand span { color: #7aab5a; font-weight: 400; }
    
    .btn-back {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(100,200,80,0.25);
      background: rgba(99,153,34,0.1);
      color: #97C459;
      font-size: 13px; font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-back:hover {
      background: rgba(99,153,34,0.22);
      border-color: rgba(100,200,80,0.45);
      color: #C0DD97;
    }

    /* ── Page header ── */
    .page-header {
      padding: 32px 0 20px;
      border-bottom: 1px solid rgba(100,200,80,0.1);
      margin-bottom: 24px;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(99,153,34,0.12);
      border: 1px solid rgba(99,153,34,0.25);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 11px; color: #97C459;
      letter-spacing: 0.05em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .page-header h1 { font-size: 22px; font-weight: 500; color: #e8f5e2; margin: 0 0 6px; }
    .page-header p  { font-size: 14px; color: #7aab5a; margin: 0; }

    /* ── Form sections ── */
    .form-section {
      background: rgba(10, 22, 10, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(100,200,80,0.13);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .form-section > h2 {
      font-size: 13px; font-weight: 500;
      color: #97C459;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 0 0 20px;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Labels & inputs ── */
    label {
      display: block;
      font-size: 12px; font-weight: 500;
      color: #7aab5a;
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="date"],
    input[type="number"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(100,200,80,0.18);
      border-radius: 8px;
      padding: 9px 13px;
      color: #e8f5e2;
      font-size: 14px; font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    input[type="file"] { padding: 7px 13px; cursor: pointer; }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(99,153,34,0.55);
      box-shadow: 0 0 0 3px rgba(99,153,34,0.12);
    }
    input::placeholder, textarea::placeholder { color: rgba(122,171,90,0.4); }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7) sepia(1) hue-rotate(60deg); cursor: pointer;
    }
    select option { background: #0d1f0d; color: #e8f5e2; }
    textarea { resize: vertical; min-height: 70px; }
    .form-group { margin-bottom: 14px; }

    /* ── Lote section ── */
    .lote-section {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(100,200,80,0.12);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .lote-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .lote-header h3 {
      font-size: 14px; font-weight: 500;
      color: #97C459; margin: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .lote-header h3::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #639922;
    }
    .lote-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .lote-info .form-group { margin-bottom: 0; }
    .lote-info .form-group.full { grid-column: 1 / -1; }
    .mapa-status { display: block; font-size: 12px; margin-top: 4px; }

    /* ── Productos table ── */
    .productos-section { margin-top: 4px; }
    .productos-section h4 {
      font-size: 12px; font-weight: 500;
      color: #7aab5a;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 0 0 12px;
    }
    .table-container { overflow-x: auto; margin-bottom: 10px; }
    .productosTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .productosTable thead tr { background: rgba(99,153,34,0.15); }
    .productosTable th {
      padding: 8px 10px;
      text-align: left;
      color: #97C459;
      font-size: 11px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.04em;
      border-bottom: 1px solid rgba(100,200,80,0.2);
      white-space: nowrap;
    }
    .productosTable td {
      padding: 7px 10px;
      color: #e8f5e2;
      border-bottom: 1px solid rgba(100,200,80,0.07);
      vertical-align: middle;
    }
    .productosTable tbody tr:hover { background: rgba(99,153,34,0.05); }
    .productosTable tfoot .total-row td {
      background: rgba(99,153,34,0.1);
      border-top: 1px solid rgba(100,200,80,0.2);
      color: #C0DD97;
      font-size: 13px;
      padding: 8px 10px;
    }
    .productosTable input,
    .productosTable select {
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 6px;
      min-width: 80px;
    }

    /* ── Buttons ── */
    .btn-delete {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(180,40,40,0.1);
      border: 1px solid rgba(180,40,40,0.25);
      border-radius: 7px;
      color: #e07070; font-size: 12px; font-weight: 500;
      padding: 5px 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-delete:hover { background: rgba(180,40,40,0.22); }

    .btn-delete-small {
      background: rgba(180,40,40,0.08);
      border: 1px solid rgba(180,40,40,0.2);
      border-radius: 6px;
      color: #e07070; font-size: 11px;
      padding: 4px 9px; cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-delete-small:hover { background: rgba(180,40,40,0.2); }

    .btn-add {
      display: inline-flex; align-items: center; gap: 8px;
      width: 100%; justify-content: center;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px dashed rgba(99,153,34,0.35);
      background: rgba(99,153,34,0.07);
      color: #97C459; font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 16px;
    }
    .btn-add:hover {
      background: rgba(99,153,34,0.16);
      border-color: rgba(99,153,34,0.5);
      color: #C0DD97;
    }

    .btn-add-small {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid rgba(55,138,221,0.3);
      background: rgba(55,138,221,0.08);
      color: #85B7EB; font-size: 12px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-add-small:hover { background: rgba(55,138,221,0.18); }

    .form-actions {
      padding: 20px 0 40px;
      display: flex; justify-content: flex-end;
    }
    .btn-generate {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      border-radius: 10px; border: none;
      background: linear-gradient(135deg, #639922, #3B6D11);
      color: #e8f5e2; font-size: 15px; font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(99,153,34,0.3);
    }
    .btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-generate:active { transform: translateY(0); }
  </style>
</head>
<body>

  <nav class="rapp-navbar">
    <div class="rapp-logo-circle"><i class="ti ti-plant"></i></div>
    <div class="rapp-brand">ReportyApp <span>· Campo</span></div>
    <a href="index.html" class="btn-back">
      <i class="ti ti-arrow-left" style="font-size:14px;"></i> Volver
    </a>
  </nav>

  <div class="container" style="max-width: 860px; padding-bottom: 40px;">

    <div class="page-header">
      <div class="eyebrow">
        <i class="ti ti-seeding" style="font-size:12px;"></i>
        Agricultura
      </div>
      <h1>Informe de Monitoreo de Cultivos</h1>
      <p>Gestión de producción agrícola · Cálculo de insumos por lote</p>
    </div>

    <form id="reporteForm">

      <section class="form-section">
        <h2><i class="ti ti-info-circle"></i> Información general</h2>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-group">
              <label for="fecha">Fecha de recorrida</label>
              <input type="date" id="fecha" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="establecimiento">Establecimiento</label>
              <input type="text" id="establecimiento" placeholder="Nombre del campo" required>
            </div>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2><i class="ti ti-map-2"></i> Lotes</h2>
        <div id="lotesContainer"></div>
        <button type="button" class="btn-add" onclick="agregarLote()">
          <i class="ti ti-plus" style="font-size:15px;"></i> Agregar lote
        </button>
        <div class="form-group" style="margin-bottom:0;">
          <label for="observacionesLote">Otras observaciones de lotes</label>
          <textarea id="observacionesLote" rows="3" placeholder="Notas adicionales..."></textarea>
        </div>
      </section>

      <div class="form-actions">
        <button type="button" class="btn-generate" onclick="generarPDF()">
          <i class="ti ti-file-type-pdf" style="font-size:18px;"></i>
          Generar PDF
        </button>
      </div>

    </form>
  </div>
 <footer class="text-light py-4 mt-auto">
  <div class="container text-center">
    <p class="mb-0">
      © 2026 Sitio Web Desarrollado por Upya Digital.
    </p>
  </div>
</footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <script>
    const appState = {
      lotes: [],
      mapasLotes: {},
    }

    let loteCounter = 0

    function formatearFecha(fechaISO) {
      if (!fechaISO) return ""
      const [year, month, day] = fechaISO.split("-")
      return `${day}/${month}/${year}`
    }

    function agregarLote() {
      const container = document.getElementById("lotesContainer")
      const loteIndex = loteCounter++

      const loteSection = document.createElement("div")
      loteSection.className = "lote-section"
      loteSection.setAttribute("data-lote-index", loteIndex)

      loteSection.innerHTML = `
        <div class="lote-header">
          <h3>Lote ${loteIndex + 1}</h3>
          <button type="button" class="btn-delete" onclick="eliminarLote(${loteIndex})">
            <i class="ti ti-trash" style="font-size:13px;"></i> Eliminar lote
          </button>
        </div>

        <div class="lote-info">
          <div class="form-group">
            <label>Nombre del lote</label>
            <input type="text" class="lote-nombre" placeholder="Ej: Lote A" required>
          </div>
          <div class="form-group">
            <label>Hectáreas</label>
            <input type="number" class="lote-hectareas" placeholder="0.00" min="0" step="0.01" required onchange="actualizarCalculosLote(${loteIndex})">
          </div>
          <div class="form-group">
            <label>Cultivo antecesor</label>
            <input type="text" class="lote-cultivo-antecesor" placeholder="Ej: Soja">
          </div>
          <div class="form-group">
            <label>Malezas</label>
            <input type="text" class="lote-malezas" placeholder="Ej: Yuyo colorado">
          </div>
          <div class="form-group">
            <label>Tratamiento</label>
            <input type="text" class="lote-tratamiento" placeholder="Ej: Herbicida">
          </div>
          <div class="form-group">
            <label>Recomendación</label>
            <input type="text" class="lote-recomendacion" placeholder="Recomendación específica">
          </div>
          <div class="form-group">
            <label>Mapa satelital</label>
            <input type="file" class="lote-mapa" accept="image/*" onchange="cargarMapaSatelital(this, ${loteIndex})">
            <span class="mapa-status"></span>
          </div>
          <div class="form-group full">
            <label>Observaciones</label>
            <textarea class="lote-observaciones" placeholder="Observaciones adicionales" rows="2"></textarea>
          </div>
        </div>

        <div class="productos-section">
          <h4><i class="ti ti-package" style="font-size:13px; margin-right:5px;"></i>Productos del lote</h4>
          <div class="table-container">
            <table class="productosTable">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Dosis/Ha</th>
                  <th>Unidad</th>
                  <th>Precio USD/Lt/Kg</th>
                  <th>USD/Ha</th>
                  <th>Cantidad total</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
              <tfoot>
                <tr class="total-row">
                  <td colspan="4"><strong>TOTAL USD/Ha:</strong></td>
                  <td class="total-usd-ha">$0.00</td>
                  <td colspan="2"></td>
                </tr>
              </tfoot>
            </table>
          </div>
          <button type="button" class="btn-add-small" onclick="agregarProducto(${loteIndex})">
            <i class="ti ti-plus" style="font-size:13px;"></i> Agregar producto
          </button>
        </div>
      `

      container.appendChild(loteSection)
    }

    function cargarMapaSatelital(input, loteIndex) {
      const file = input.files[0]
      if (file) {
        const reader = new FileReader()
        reader.onload = (e) => {
          appState.mapasLotes[loteIndex] = e.target.result
          const statusSpan = input.nextElementSibling
          statusSpan.textContent = "✓ Cargado"
          statusSpan.style.color = "#97C459"
          statusSpan.style.fontWeight = "bold"
        }
        reader.readAsDataURL(file)
      }
    }

    function eliminarLote(loteIndex) {
      const loteSection = document.querySelector(`[data-lote-index="${loteIndex}"]`)
      if (loteSection) {
        delete appState.mapasLotes[loteIndex]
        loteSection.remove()
      }
    }

    function agregarProducto(loteIndex) {
      const loteSection = document.querySelector(`[data-lote-index="${loteIndex}"]`)
      const tbody = loteSection.querySelector(".productosTable tbody")

      const row = document.createElement("tr")
      row.innerHTML = `
        <td><input type="text" class="prod-nombre" placeholder="Ej: Glifosato" required></td>
        <td><input type="number" class="prod-dosis-hectarea" placeholder="0.00" min="0" step="0.01" required onchange="actualizarCalculosLote(${loteIndex})"></td>
        <td>
          <select class="prod-unidad" required>
            <option value="L/ha">L/ha</option>
            <option value="kg/ha">kg/ha</option>
          </select>
        </td>
        <td><input type="number" class="prod-precio-usd" placeholder="0.00" min="0" step="0.01" required onchange="actualizarCalculosLote(${loteIndex})"></td>
        <td class="prod-usd-ha-display">$0.00</td>
        <td class="prod-cantidad-total-display">0.00 L</td>
        <td><button type="button" class="btn-delete-small" onclick="eliminarProducto(this, ${loteIndex})">Eliminar</button></td>
      `
      tbody.appendChild(row)
    }

    function eliminarProducto(btn, loteIndex) {
      btn.closest("tr").remove()
      actualizarCalculosLote(loteIndex)
    }

    function actualizarCalculosLote(loteIndex) {
      const loteSection = document.querySelector(`[data-lote-index="${loteIndex}"]`)
      if (!loteSection) return

      const hectareas = parseFloat(loteSection.querySelector(".lote-hectareas").value) || 0
      const tbody = loteSection.querySelector(".productosTable tbody")
      const filas = tbody.querySelectorAll("tr")

      let totalUsdHa = 0

      filas.forEach((fila) => {
        const dosisHectarea = parseFloat(fila.querySelector(".prod-dosis-hectarea").value) || 0
        const precioUsd = parseFloat(fila.querySelector(".prod-precio-usd").value) || 0
        const unidad = fila.querySelector(".prod-unidad").value
        const usdHaDisplay = fila.querySelector(".prod-usd-ha-display")
        const cantidadTotalDisplay = fila.querySelector(".prod-cantidad-total-display")

        const usdHa = dosisHectarea > 0 ? precioUsd * dosisHectarea : 0
        usdHaDisplay.textContent = `$${usdHa.toFixed(2)}`

        const cantidadTotal = dosisHectarea * hectareas
        const unidadBase = unidad.split("/")[0]
        cantidadTotalDisplay.textContent = `${cantidadTotal.toFixed(2)} ${unidadBase}`

        totalUsdHa += usdHa
      })

      loteSection.querySelector(".total-usd-ha").textContent = `$${totalUsdHa.toFixed(2)}`
    }

    function recopilarLotes() {
      const loteSections = document.querySelectorAll(".lote-section")
      const lotesData = []

      loteSections.forEach((loteSection) => {
        const loteIndex = loteSection.getAttribute("data-lote-index")
        const nombre = loteSection.querySelector(".lote-nombre").value.trim()
        const hectareas = parseFloat(loteSection.querySelector(".lote-hectareas").value) || 0
        const cultivoAntecesor = loteSection.querySelector(".lote-cultivo-antecesor").value.trim()
        const malezas = loteSection.querySelector(".lote-malezas").value.trim()
        const tratamiento = loteSection.querySelector(".lote-tratamiento").value.trim()
        const recomendacion = loteSection.querySelector(".lote-recomendacion").value.trim()
        const observaciones = loteSection.querySelector(".lote-observaciones").value.trim()
        const mapaSatelital = appState.mapasLotes[loteIndex] || null

        const tbody = loteSection.querySelector(".productosTable tbody")
        const filas = tbody.querySelectorAll("tr")
        const productos = []
        let totalUsdHa = 0

        filas.forEach((fila) => {
          const nombreProd = fila.querySelector(".prod-nombre").value.trim()
          const dosisHectarea = parseFloat(fila.querySelector(".prod-dosis-hectarea").value) || 0
          const unidad = fila.querySelector(".prod-unidad").value
          const precioUsd = parseFloat(fila.querySelector(".prod-precio-usd").value) || 0
          const usdHa = dosisHectarea > 0 ? precioUsd * dosisHectarea : 0
          const cantidadTotal = dosisHectarea * hectareas

          if (nombreProd && dosisHectarea > 0) {
            productos.push({ nombre: nombreProd, dosisHectarea, unidad, precioUsd, usdHa, cantidadTotal })
            totalUsdHa += usdHa
          }
        })

        if (nombre && hectareas > 0) {
          lotesData.push({ nombre, hectareas, cultivoAntecesor, malezas, tratamiento, recomendacion, observaciones, mapaSatelital, productos, totalUsdHa })
        }
      })

      return lotesData
    }

    async function generarPDF() {
      const fecha = document.getElementById("fecha").value
      const establecimiento = document.getElementById("establecimiento").value

      if (!fecha || !establecimiento) {
        alert("Por favor completa los campos obligatorios: Fecha y Establecimiento")
        return
      }

      const lotes = recopilarLotes()
      if (lotes.length === 0) {
        alert("Por favor agrega al menos un lote")
        return
      }

      const observacionesLote = document.getElementById("observacionesLote").value
      const { jsPDF } = window.jspdf
      const doc = new jsPDF()

      const pageWidth = doc.internal.pageSize.getWidth()
      const pageHeight = doc.internal.pageSize.getHeight()
      const margin = 20

      doc.setFillColor(255, 255, 255)
      doc.rect(0, 0, pageWidth, pageHeight, "F")

      doc.setFillColor(34, 139, 34)
      doc.rect(0, 0, pageWidth, 40, "F")

      let yPos = 18
      doc.setFontSize(18)
      doc.setFont(undefined, "bold")
      doc.setTextColor(255, 255, 255)
      doc.text("INFORME DE MONITOREO DE CULTIVOS", pageWidth / 2, yPos, { align: "center" })

      yPos = 50
      doc.setFontSize(12)
      doc.setFont(undefined, "bold")
      doc.setTextColor(34, 139, 34)
      doc.text("INFORMACION GENERAL", margin, yPos)
      yPos += 2
      doc.setDrawColor(34, 139, 34)
      doc.setLineWidth(0.3)
      doc.line(margin, yPos, pageWidth - margin, yPos)
      yPos += 8

      doc.setFontSize(10)
      doc.setFont(undefined, "normal")
      doc.setTextColor(0, 0, 0)
      doc.text(`Fecha de recorrida: ${formatearFecha(fecha)}`, margin + 5, yPos)
      yPos += 6
      doc.text(`Establecimiento: ${establecimiento}`, margin + 5, yPos)
      yPos += 12

      doc.setFontSize(12)
      doc.setFont(undefined, "bold")
      doc.setTextColor(34, 139, 34)
      doc.text("DETALLE DE LOTES", margin, yPos)
      yPos += 2
      doc.setDrawColor(34, 139, 34)
      doc.setLineWidth(0.3)
      doc.line(margin, yPos, pageWidth - margin, yPos)
      yPos += 8

      lotes.forEach((lote) => {
        if (yPos > 240) { doc.addPage(); yPos = margin }

        doc.setFillColor(240, 248, 240)
        doc.rect(margin, yPos - 5, pageWidth - 2 * margin, 8, "F")
        doc.setFontSize(11)
        doc.setFont(undefined, "bold")
        doc.setTextColor(34, 139, 34)
        doc.text(lote.nombre, margin + 3, yPos)
        doc.setFont(undefined, "normal")
        doc.setTextColor(80, 80, 80)
        doc.text(`(${lote.hectareas} ha)`, margin + 50, yPos)
        yPos += 8

        doc.setFontSize(9)
        doc.setTextColor(0, 0, 0)

        if (lote.cultivoAntecesor) {
          doc.setFont(undefined, "bold"); doc.text("Cultivo Antecesor:", margin + 5, yPos)
          doc.setFont(undefined, "normal"); doc.text(lote.cultivoAntecesor, margin + 45, yPos)
          yPos += 5
        }
        if (lote.malezas) {
          doc.setFont(undefined, "bold"); doc.text("Malezas:", margin + 5, yPos)
          doc.setFont(undefined, "normal"); doc.text(lote.malezas, margin + 45, yPos)
          yPos += 5
        }
        if (lote.tratamiento) {
          doc.setFont(undefined, "bold"); doc.text("Tratamiento:", margin + 5, yPos)
          doc.setFont(undefined, "normal"); doc.text(lote.tratamiento, margin + 45, yPos)
          yPos += 5
        }
        if (lote.recomendacion) {
          doc.setFont(undefined, "bold"); doc.text("Recomendacion:", margin + 5, yPos)
          doc.setFont(undefined, "normal")
          const splitRec = doc.splitTextToSize(lote.recomendacion, pageWidth - margin - 50)
          doc.text(splitRec, margin + 45, yPos)
          yPos += splitRec.length * 5
        }
        if (lote.observaciones) {
          doc.setFont(undefined, "bold"); doc.text("Observaciones:", margin + 5, yPos)
          doc.setFont(undefined, "normal")
          const splitObs = doc.splitTextToSize(lote.observaciones, pageWidth - margin - 50)
          doc.text(splitObs, margin + 45, yPos)
          yPos += splitObs.length * 5
        }

        yPos += 3

        if (lote.mapaSatelital) {
          if (yPos > 200) { doc.addPage(); yPos = margin }
          doc.setFont(undefined, "bold")
          doc.text("Mapa Satelital:", margin + 5, yPos)
          yPos += 5
          try {
            doc.addImage(lote.mapaSatelital, "JPEG", margin + 5, yPos, 80, 60)
            yPos += 65
          } catch (error) {
            console.error("Error adding satellite map:", error)
            doc.setFont(undefined, "italic")
            doc.setTextColor(150, 150, 150)
            doc.text("(Error al cargar mapa)", margin + 5, yPos)
            yPos += 5
          }
        }

        if (lote.productos.length > 0) {
          doc.autoTable({
            startY: yPos,
            head: [["Producto", "Dosis/Ha", "Precio USD/Lt/Kg", "USD/Ha", "Cantidad Total"]],
            body: lote.productos.map((p) => [
              p.nombre,
              `${p.dosisHectarea} ${p.unidad}`,
              `$${p.precioUsd.toFixed(2)}`,
              `$${p.usdHa.toFixed(2)}`,
              `${p.cantidadTotal.toFixed(2)} ${p.unidad.split("/")[0]}`,
            ]),
            foot: [[
              { content: "TOTAL USD/Ha:", colSpan: 3, styles: { halign: "right", fontStyle: "bold" } },
              { content: `$${lote.totalUsdHa.toFixed(2)}`, styles: { fontStyle: "bold", fillColor: [240, 248, 240] } },
              "",
            ]],
            theme: "grid",
            headStyles: { fillColor: [34, 139, 34], textColor: [255, 255, 255], fontStyle: "bold", halign: "center", fontSize: 9 },
            bodyStyles: { fontSize: 8, textColor: [0, 0, 0] },
            footStyles: { fillColor: [240, 248, 240], textColor: [34, 139, 34], fontSize: 9 },
            alternateRowStyles: { fillColor: [248, 248, 248] },
            margin: { left: margin + 5, right: margin + 5 },
            styles: { cellPadding: 2 },
          })
          yPos = doc.lastAutoTable.finalY + 10
        }
      })

      if (observacionesLote) {
        if (yPos > 230) { doc.addPage(); yPos = margin }
        doc.setFontSize(11)
        doc.setFont(undefined, "bold")
        doc.setTextColor(34, 139, 34)
        doc.text("OBSERVACIONES GENERALES DE LOTES", margin, yPos)
        yPos += 2
        doc.setDrawColor(34, 139, 34)
        doc.line(margin, yPos, pageWidth - margin, yPos)
        yPos += 7
        doc.setFont(undefined, "normal")
        doc.setTextColor(0, 0, 0)
        doc.setFontSize(9)
        const splitObs = doc.splitTextToSize(observacionesLote, pageWidth - 2 * margin)
        doc.text(splitObs, margin + 5, yPos)
      }

      const nombreArchivo = `Informe_${establecimiento.replace(/\s+/g, "_")}_${fecha.replace(/\//g, "-")}.pdf`
      doc.save(nombreArchivo)
    }

    window.addEventListener("DOMContentLoaded", () => {
      agregarLote()
    })
  </script>

</body>
</html>
